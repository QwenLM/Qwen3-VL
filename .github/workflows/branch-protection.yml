name: Branch Protection Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-protection:
    name: Verify Branch Protection Rules
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check if PR requires review
      run: |
        echo "This PR targets the main branch and should require at least one review"
        echo "Branch protection should be configured via GitHub settings or the setup script"
