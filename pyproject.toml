[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: module-level import not at top — needed because src/Qwen3VLTesting.py
# patches sys.path and sys.modules before importing everything else.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["import-untyped"]
exclude = ["local_transformers/", "__pycache__/"]

[[tool.mypy.overrides]]
module = "local_transformers.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "torch.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true
